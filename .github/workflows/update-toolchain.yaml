name: "Update Typst Toolchain"

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update toolchain versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update-toolchain.py

      - name: Validate build definition
        uses: docker/bake-action@v6
        with:
          source: .
          workdir: ./src/typst
          targets: typst
          call: check

      - name: Create update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automated/update-typst-toolchain
          delete-branch: true
          commit-message: "build: update Typst toolchain"
          title: "build: update Typst toolchain"
          body: |
            Automated update of the three newest stable Typst releases and their Rust/Pandoc toolchain.

            This pull request was created by the scheduled `Update Typst Toolchain` workflow.
