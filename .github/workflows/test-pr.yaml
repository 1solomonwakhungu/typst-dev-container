name: "CI - Test Templates"
on:
  pull_request:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            typst: ./**/typst/**

  test:
    needs: [detect-changes]
    # With no matching changes the filter emits `[]`, and GitHub rejects an
    # empty matrix outright, failing the run. Skip the job instead so pull
    # requests that touch no template still get a green check.
    if: ${{ needs.detect-changes.outputs.templates != '[]' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        templates: ${{ fromJSON(needs.detect-changes.outputs.templates) }}
    steps:
      - uses: actions/checkout@v7

      - name: Smoke test for '${{ matrix.templates }}'
        id: smoke_test
        uses: ./.github/actions/smoke-test
        with:
          template: "${{ matrix.templates }}"
