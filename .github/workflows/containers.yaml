name: "Typst: Build & Publish to ghcr.io"

on:
  pull_request:
    paths:
      - "images/typst/**"
      - ".devcontainer/**"
      - ".github/workflows/containers.yaml"
  push:
    branches:
      - main
    paths:
      - "images/typst/**"
      - ".devcontainer/**"
      - ".github/workflows/containers.yaml"
  workflow_dispatch:

# Pushes to main that land close together would otherwise push the same tags
# at once. Queue them so the newest commit is always the last to publish.
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push-typst:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Setup QEMU"
        uses: "docker/setup-qemu-action@v4"

      - name: "Setup Docker `buildx`"
        uses: "docker/setup-buildx-action@v4"

      # Only main publishes. A manual dispatch on another branch still builds,
      # but must not overwrite the tags that users pull.
      - name: "Login to `ghcr.io`"
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: "docker/login-action@v4"
        with:
          registry: "ghcr.io"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Build image"
        id: bake
        uses: docker/bake-action@v7
        with:
          source: "./images/typst"
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
